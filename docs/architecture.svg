<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <!-- Pure White Strict Background -->
  <rect width="960" height="560" fill="#ffffff" />
  
  <!-- Modern Technical Blueprint Grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="1" />
    </pattern>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>
  <rect width="960" height="560" fill="url(#grid)" />

  <!-- Outer Border -->
  <rect x="20" y="20" width="920" height="520" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="40" y="40" width="880" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="65" cy="70" r="14" fill="#0284c7" />
  <text x="65" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">RAG</text>
  <text x="90" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">LangChain Production RAG Document Q&amp;A Architecture</text>
  <text x="90" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Recursive Text Chunking, ChromaDB Vector Store, MMR Reranking, and FastAPI Endpoints</text>
  <rect x="760" y="55" width="140" height="30" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
  <text x="830" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">STRICT PURE WHITE</text>

  <!-- Left: Ingestion Flow -->
  <g transform="translate(45, 125)">
    <rect width="260" height="345" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="260" height="36" rx="10" fill="#f1f5f9" />
    <text x="130" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Stage 1: Document Ingestion</text>

    <!-- Document Source -->
    <rect x="15" y="50" width="230" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="25" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Raw Document Corpus</text>
    <text x="25" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">PDFs, Markdown, Text, HTML</text>

    <!-- Recursive Chunking -->
    <rect x="15" y="115" width="230" height="75" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="25" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e40af">Recursive Character Splitter</text>
    <text x="25" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#2563eb">&#x2022; Chunk Size: 1000 characters</text>
    <text x="25" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#2563eb">&#x2022; Chunk Overlap: 200 characters</text>
    <text x="25" y="182" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#2563eb">&#x2022; Semantic Paragraph Boundaries</text>

    <!-- Embedding Model -->
    <rect x="15" y="205" width="230" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="25" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0f172a">Vector Embeddings</text>
    <text x="25" y="241" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">OpenAI text-embedding-3-small</text>
    <text x="25" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">1536-dimensional dense vectors</text>

    <!-- Ingestion Endpoint -->
    <rect x="15" y="280" width="230" height="50" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
    <text x="25" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803d">POST /ingest Endpoint</text>
    <text x="25" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#166534">Automated indexing &amp; lineage tracking</text>
  </g>

  <!-- Middle: Storage & MMR Retrieval Engine -->
  <g transform="translate(330, 125)">
    <rect width="280" height="345" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="280" height="36" rx="10" fill="#f0f9ff" />
    <text x="140" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">Stage 2: Storage &amp; MMR Retrieval</text>

    <!-- ChromaDB Vector Store -->
    <rect x="15" y="50" width="250" height="105" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="25" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">ChromaDB Persistent Store</text>
    <text x="25" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">&#x2022; HNSW Graph Indexing (Cosine Distance)</text>
    <text x="25" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">&#x2022; Collection: enterprise_knowledge</text>
    <text x="25" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">&#x2022; Directory: ./chroma_db persistence</text>
    <text x="25" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">&#x2022; Metadata filtering enabled</text>

    <!-- MMR Reranking Engine -->
    <rect x="15" y="170" width="250" height="155" rx="6" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5" />
    <text x="25" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9d174d">Maximal Marginal Relevance (MMR)</text>
    <text x="25" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#831843">&#x2022; Initial Candidate Fetch: fetch_k = 20</text>
    <text x="25" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#831843">&#x2022; Final Selection Pool: top_k = 5</text>
    <text x="25" y="244" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#831843">&#x2022; Diversity Tradeoff: lambda_mult = 0.7</text>
    
    <rect x="25" y="255" width="230" height="55" rx="4" fill="#ffffff" stroke="#f472b6" stroke-width="1" />
    <text x="35" y="273" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#9d174d">Diversity Scoring Formula:</text>
    <text x="35" y="293" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#be185d">Score = &#955; Sim(Q, D) - (1-&#955;) max Sim(D, D_i)</text>
  </g>

  <!-- Right: FastAPI Query Gateway & LLM Synthesis -->
  <g transform="translate(635, 125)">
    <rect width="280" height="345" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="280" height="36" rx="10" fill="#ecfdf5" />
    <text x="140" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">Stage 3: Generation &amp; API Service</text>

    <!-- FastAPI Application -->
    <rect x="15" y="50" width="250" height="85" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="25" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">FastAPI REST Server (Port 8000)</text>
    <text x="25" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">&#x2022; POST /query: Q&amp;A + Sources</text>
    <text x="25" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">&#x2022; GET /health: Health &amp; Liveness</text>
    <text x="25" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">&#x2022; CORS Middleware configured</text>

    <!-- Context Grounding & Prompt Template -->
    <rect x="15" y="150" width="250" height="80" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="25" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1e40af">Contextual Grounding Prompt</text>
    <text x="25" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#2563eb">&#x2022; Strict Hallucination Elimination</text>
    <text x="25" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#2563eb">&#x2022; Formatted Source Passages &amp; Citations</text>
    <text x="25" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#2563eb">&#x2022; Zero-temperature determinism</text>

    <!-- LLM Generation Box -->
    <rect x="15" y="245" width="250" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="25" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">LLM Inference (GPT-4o)</text>
    <text x="25" y="283" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">&#x2022; Structured Output Serialization</text>
    <text x="25" y="299" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">&#x2022; Pydantic QueryResponse schema</text>
    <text x="25" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">&#x2022; Complete Latency Metrics (ms)</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M 305 220 L 330 220" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 610 220 L 635 220" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)" />

  <!-- Footer -->
  <rect x="40" y="490" width="880" height="35" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="55" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">Production Standards:</text>
  <text x="180" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Persistent ChromaDB Index</text>
  <text x="360" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">&#x2022; MMR Diversity Reranking</text>
  <text x="570" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">&#x2022; FastAPI Async Endpoint with Citations</text>
</svg>
